# ------------------------------------------------------------
# Site settings — edit these
# ------------------------------------------------------------
title: "Your Name"
tagline: "Things I tried that probably didn't work"
description: "Personal exploration into agents and machine learning"
author: "Your Name"

# If your repo is <username>.github.io, leave baseurl empty.
# If it's a project repo (e.g. github.com/you/blog), set baseurl: "/blog"
url: ""
baseurl: ""

# Links shown in the footer and on the About page (leave blank to hide)
links:
  email: ""
  github: ""
  twitter: ""
  linkedin: ""
  scholar: ""

# ------------------------------------------------------------
# Build settings — you shouldn't need to touch these
# ------------------------------------------------------------
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  math_engine: mathjax

permalink: /:title/
excerpt_separator: "<!--more-->"

plugins:
  - jekyll-feed
  - jekyll-seo-tag

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
